# One-click deploy on Render: New → Blueprint → pick this repo.
# Creates the web app (UI + API + MCP endpoint) and a free PostgreSQL database.
services:
  - type: web
    name: rostapay
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rostapay-db
          property: connectionString
databases:
  - name: rostapay-db
    plan: free
    region: singapore
    databaseName: rostapay
    user: rostapay
